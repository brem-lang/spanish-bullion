# spanish.leadsallyearlong.space: static page + PHP API (php8.5-fpm).
# Install: ln -s /var/www/spanish-bullion/deploy/nginx-spanish.conf /etc/nginx/sites-enabled/spanish-leadsallyearlong
#          nginx -t && systemctl reload nginx && certbot --nginx -d spanish.leadsallyearlong.space
server {
    server_name spanish.leadsallyearlong.space;

    root /var/www/spanish-bullion;
    index index.html;
    charset utf-8;

    # Only Cloudflare may connect, so CF-Connecting-IP / CF-IPCountry can be trusted.
    include /etc/nginx/snippets/cloudflare-only.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # .env, .git, .htaccess, ... and repo-only files
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(README\.md|deploy/) { return 404; }

    location = /api/submit-lead.php {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    location = /api/prices.php {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 20s;
    }

    # No other PHP is served
    location ~ \.php$ { return 404; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/spanish.leadsallyearlong.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/spanish.leadsallyearlong.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = spanish.leadsallyearlong.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name spanish.leadsallyearlong.space;
    return 404; # managed by Certbot


}